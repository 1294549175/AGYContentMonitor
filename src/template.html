<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Context Monitor</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        background: var(--color-background-primary, #111318);
        color: var(--color-text-primary, #e6edf3);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
        font-size: 13px;
        line-height: 1.45;
      }
      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
      }
      .title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      .ws-select {
        max-width: 220px;
        padding: 3px 8px;
        font-size: 12px;
        border-radius: 999px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .segmented {
        display: inline-flex;
        background: var(--color-background-secondary, rgba(255, 255, 255, 0.06));
        border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.12));
        border-radius: 7px;
        padding: 2px;
      }
      .segmented button {
        border: none;
        background: transparent;
        color: var(--color-text-secondary, #9aa4b2);
        padding: 4px 9px;
        font-size: 12px;
        border-radius: 5px;
        cursor: pointer;
        font-family: inherit;
      }
      .segmented button.active {
        background: var(--color-background-primary, #2563eb);
        color: var(--color-text-primary, #ffffff);
        font-weight: 500;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }
      .segmented button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      select,
      .btn {
        background: var(--color-background-secondary, rgba(255, 255, 255, 0.06));
        color: var(--color-text-primary, #e6edf3);
        border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.14));
        border-radius: 7px;
        padding: 4px 9px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn:hover:not(:disabled),
      select:hover {
        border-color: var(--color-ring-primary, #3b82f6);
      }
      .error-banner {
        margin-bottom: 10px;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 12px;
        background: rgba(239, 68, 68, 0.12);
        color: var(--color-text-danger, #f87171);
        border: 1px solid rgba(239, 68, 68, 0.35);
      }
      .error-banner.hidden {
        display: none;
      }
      .summary-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--color-text-secondary, #9aa4b2);
      }
      .quota-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 8px;
        margin-bottom: 11px;
      }
      .quota-strip.hidden {
        display: none;
      }
      .quota-card {
        background: var(--color-background-secondary, rgba(255, 255, 255, 0.04));
        border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
        border-radius: 8px;
        padding: 7px 9px;
      }
      .quota-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 5px;
      }
      .quota-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--color-text-primary, #e6edf3);
      }
      .quota-stale {
        font-size: 10px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--color-background-tertiary, rgba(148, 163, 184, 0.16));
        color: var(--color-text-secondary, #9aa4b2);
        border: 1px solid var(--color-border-secondary, rgba(148, 163, 184, 0.25));
      }
      .quota-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--color-text-secondary, #9aa4b2);
        margin-bottom: 2px;
      }
      .quota-row strong {
        color: var(--color-text-primary, #e6edf3);
      }
      .quota-bar {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--color-background-tertiary, rgba(255, 255, 255, 0.08));
        overflow: hidden;
        margin-bottom: 5px;
      }
      .quota-bar:last-child {
        margin-bottom: 0;
      }
      .quota-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      .q-ok {
        background: #10b981;
      }
      .q-warn {
        background: #f59e0b;
      }
      .q-danger {
        background: #ef4444;
      }
      .summary-item strong {
        color: var(--color-text-primary, #e6edf3);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .card {
        background: var(--color-background-secondary, rgba(255, 255, 255, 0.04));
        border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
        border-radius: 10px;
        padding: 11px 13px;
        transition: border-color 0.15s ease;
      }
      .card.running {
        border-color: var(--color-border-info, rgba(59, 130, 246, 0.55));
      }
      .card.current {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.11);
        box-shadow: inset 3px 0 0 #3b82f6, 0 0 0 1px rgba(59, 130, 246, 0.25);
      }
      .current-badge {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--color-background-info, rgba(59, 130, 246, 0.2));
        color: var(--color-text-info, #3b82f6);
        border: 1px solid var(--color-border-info, rgba(59, 130, 246, 0.45));
        flex-shrink: 0;
      }
      .compacted-badge {
        font-size: 10px;
        font-weight: 500;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.35);
        flex-shrink: 0;
      }
      .ws-tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--color-background-tertiary, rgba(148, 163, 184, 0.14));
        color: var(--color-text-secondary, #9aa4b2);
        border: 1px solid var(--color-border-secondary, rgba(148, 163, 184, 0.22));
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }
      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .card-title-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        flex: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--color-text-tertiary, #64748b);
      }
      .dot.running {
        background: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
      }
      .card-title {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        font-size: 11px;
        color: var(--color-text-secondary, #9aa4b2);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }
      .progress-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .progress-track {
        width: 100%;
        height: 7px;
        border-radius: 999px;
        background: var(--color-background-tertiary, rgba(255, 255, 255, 0.08));
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.25s ease;
      }
      .fill-ok {
        background: #3b82f6;
      }
      .fill-warn {
        background: #f59e0b;
      }
      .fill-danger {
        background: #ef4444;
      }
      .metrics {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--color-text-secondary, #9aa4b2);
      }
      .metrics-left {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .link-btn {
        background: none;
        border: none;
        padding: 0;
        color: var(--color-text-info, #60a5fa);
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
      }
      .link-btn:hover:not(:disabled) {
        text-decoration: underline;
      }
      .link-btn:disabled {
        color: var(--color-text-disabled, #64748b);
        cursor: not-allowed;
        opacity: 0.75;
      }
      .link-btn.err {
        color: var(--color-text-danger, #f87171);
      }
      .empty {
        text-align: center;
        padding: 32px 16px;
        color: var(--color-text-secondary, #9aa4b2);
        border: 1px dashed var(--color-border-primary, rgba(255, 255, 255, 0.14));
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title-group">
        <h1 class="title">Context Monitor</h1>
        <select id="ws-select" class="ws-select" title="切换工作区过滤" aria-label="工作区过滤">
          <option value="auto">自动跟随</option>
        </select>
      </div>
      <div class="controls">
        <div class="segmented" role="group" aria-label="会话范围">
          <button id="btn-scope-ws" class="active" type="button">当前工作区</button>
          <button id="btn-scope-all" type="button">全部会话</button>
        </div>
        <select id="window-select" title="上下文窗口上限">
          <option value="200000">200K 窗口</option>
          <option value="240000" selected>240K 窗口</option>
          <option value="512000">512K 窗口</option>
          <option value="1048576">1M 窗口</option>
          <option value="2097152">2M 窗口</option>
        </select>
        <button id="btn-auto" class="btn" type="button">自动刷新: 开</button>
        <button id="btn-refresh" class="btn" type="button">刷新</button>
      </div>
    </div>

    <div id="error-banner" class="error-banner hidden" role="alert"></div>
    <div id="quota-strip" class="quota-strip hidden"></div>
    <div id="summary" class="summary-bar"></div>
    <div id="session-list" class="list">
      <div class="empty">正在读取本地 Antigravity 会话日志...</div>
    </div>

    <!--__UI_SCRIPT__-->
  </body>
</html>
